# Render Blueprint - Murshid (tout gratuit)
# Deploie 3 services : PostgreSQL + backend Spring Boot (Docker) + frontend Angular (statique).
# IA : Groq (API cloud, gratuite). Renseignez GROQ_API_KEY dans le dashboard Render.
#
# Deploiement : Render > New > Blueprint > selectionnez ce repo.
# Docs : https://render.com/docs/blueprint-spec

databases:
  - name: murshid-db
    databaseName: murshid_db
    user: murshid
    plan: free

services:
  # --- Backend Spring Boot (Docker) ---
  - type: web
    name: murshid-backend
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      # Connexion DB injectee automatiquement depuis la base murshid-db via
      # son connectionString externe (user:password@host...). Pas de mot de
      # passe en dur : si la base est recreee/rotée, DATABASE_URL reste correct.
      # L'URL externe fonctionne meme si backend et DB sont dans des regions
      # differentes. Le backend extrait user/password depuis cette URL.
      - key: DATABASE_URL
        fromDatabase:
          name: murshid-db
          property: connectionString
      # Secret JWT FIXE (ne pas utiliser generateValue, sinon toutes les sessions
      # sont invalidees a chaque deploiement et l'utilisateur doit se reconnecter).
      - key: APP_JWTSECRET
        value: MurshidFixedJwtSecretKey2024SuperSecretProductionGradeKeyDoNotShareOutsideRenderDeployContext1234567890
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      # A renseigner manuellement dans le dashboard Render (secret) :
      - key: GROQ_API_KEY
        sync: false
      - key: VOICERSS_API_KEY
        sync: false

  # --- Frontend Angular (site statique) ---
  - type: web
    name: murshid-frontend
    runtime: static
    buildCommand: cd frontend && npm install && node ./node_modules/@angular/cli/bin/ng.js build --configuration production --project murshid-web --output-path /opt/render/project/src/frontend/dist/murshid-web/browser && mkdir -p /opt/render/project/src/publish && rm -rf /opt/render/project/src/publish/* && cp -r /opt/render/project/src/frontend/dist/murshid-web/browser /opt/render/project/src/publish/site
    staticPublishPath: publish/site
    envVars:
      - key: NODE_VERSION
        value: "20"
    routes:
      # SPA fallback : toute route renvoie vers index.html
      - type: rewrite
        source: /*
        destination: /index.html
