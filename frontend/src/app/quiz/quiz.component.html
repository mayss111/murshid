<div class="container animate-fade-in" *ngIf="!loading && questions.length > 0">
  <div class="quiz-card glass-panel">
    <div class="quiz-header">
      <div>
        <span class="badge badge-gold">Leçon : {{ lecon?.titre }}</span>
        <h2>التقييم والتمرين التفاعلي</h2>
      </div>
      <div class="question-counter">
        السؤال {{ currentQuestionIndex + 1 }} من {{ questions.length }}
      </div>
    </div>

    <div class="question-box">
      <div class="question-meta-row">
        <span class="question-type-badge" [class]="questionTypeClass">{{ questionTypeLabel }}</span>
      </div>

      <div class="question-title">
        <h3 class="question-text">{{ currentQ.texte }}</h3>
      </div>

      <!-- QCM Choices -->
      <div class="answer-section" *ngIf="!submitted && currentQ.type === 'QCM' && getChoices().length > 0">
        <label>اختر الإجابة الصحيحة:</label>
        <div class="choices-grid">
          <button
            type="button"
            *ngFor="let choix of getChoices()"
            class="choice-card"
            [class.selected]="isChoiceSelected(choix)"
            (click)="selectChoice(choix)"
          >
            <span class="choice-letter">{{ getChoices().indexOf(choix) + 1 | number:'2.0-0' }}</span>
            <span class="choice-text">{{ choix }}</span>
          </button>
        </div>
      </div>

      <!-- TRUE / FALSE -->
      <div class="answer-section" *ngIf="!submitted && currentQ.type === 'TRUE_FALSE'">
        <label>حدّد صحة العبارة:</label>
        <div class="true-false-buttons">
          <button
            type="button"
            class="tf-btn true-btn"
            [class.selected]="selectedTrueFalse === true"
            (click)="selectTrueFalse(true)"
          >
            <i class="fa-solid fa-check"></i> صح
          </button>
          <button
            type="button"
            class="tf-btn false-btn"
            [class.selected]="selectedTrueFalse === false"
            (click)="selectTrueFalse(false)"
          >
            <i class="fa-solid fa-xmark"></i> خطأ
          </button>
        </div>
      </div>

      <!-- Text Answer -->
      <div class="answer-section" *ngIf="!submitted && currentQ.type !== 'QCM' && currentQ.type !== 'TRUE_FALSE'">
        <label>أدخل إجابتك المكتوبة:</label>
        <textarea
          [(ngModel)]="userAnswer"
          class="form-textarea"
          rows="4"
          placeholder="اكتب إجابتك هنا بدقّة..."
        ></textarea>
      </div>

      <button
        (click)="submitAnswer()"
        class="btn-primary submit-btn"
        [disabled]="submitting || !userAnswer.trim()"
        *ngIf="!submitted"
      >
        <i class="fa-solid fa-paper-plane" *ngIf="!submitting"></i>
        <span>{{ submitting ? 'جارٍ التقييم بالذكاء الاصطناعي...' : 'إرسال إجابتي' }}</span>
      </button>

      <!-- Evaluation Feedback Box -->
      <div *ngIf="submitted" class="evaluation-box glass-card animate-fade-in" [style.border-color]="getEvaluationColor()">
        <div class="eval-header">
          <div class="points-badge" [style.background]="'rgba(212, 175, 55, 0.2)'">
            <i class="fa-solid fa-trophy gold-text"></i> +{{ points }} نقاط
          </div>
          <h4>تقييم فوري بالذكاء الاصطناعي</h4>
        </div>
        <p class="eval-body">{{ evaluation }}</p>

        <div class="eval-actions">
          <button *ngIf="currentQuestionIndex < questions.length - 1" (click)="nextQuestion()" class="btn-primary">
            السؤال التالي <i class="fa-solid fa-arrow-left"></i>
          </button>
          <button *ngIf="currentQuestionIndex === questions.length - 1" (click)="nextQuestion()" class="btn-primary">
            إنهاء الاختبار والعودة إلى لوحة التحكم <i class="fa-solid fa-check-double"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="container" *ngIf="!loading && questions.length === 0">
  <div class="glass-card text-center" style="padding: 3rem;">
    <h3>لا توجد أسئلة متاحة في هذا الدرس.</h3>
    <a routerLink="/dashboard" class="btn-primary" style="margin-top: 1rem;">العودة إلى لوحة التحكم</a>
  </div>
</div>
