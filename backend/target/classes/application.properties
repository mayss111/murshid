# Server Configuration
server.port=8085

# Application Name
spring.application.name=murshid-backend

# Database Configuration (PostgreSQL). Overridable via env vars.
# SPRING_DATASOURCE_URL prend le dessus s'il est defini (docker-compose).
# Sinon l'URL est construite a partir de DB_HOST/DB_PORT/DB_NAME (Render).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:murshid_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Fallback H2 console for quick standalone testing if enabled
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Security / JWT Configuration (secret overridable via APP_JWTSECRET)
app.jwtSecret=${APP_JWTSECRET:SuperSecretKeyForMurshidIslamicLearningPlatformMinimum32Characters!}
app.jwtExpiration=3600000

# Groq API Integration (cloud, OpenAI-compatible)
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# Logging
logging.level.root=INFO
logging.level.com.murshid=DEBUG
logging.level.org.springframework.security=INFO
